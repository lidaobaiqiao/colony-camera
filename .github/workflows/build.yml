name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build, test and inspect final JAR
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload build and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colony-camera-build
          path: |
            dist/
            build/reports/tests/test/
          if-no-files-found: warn
