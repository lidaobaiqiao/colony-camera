<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Colony Camera UI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;
  font-family:"Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif;cursor:default}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#cv{position:relative;transform-origin:center;background:#000}

.p{background:rgba(16,28,40,.88);border:1px solid #334958;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:9px;line-height:9px;color:#90a8b8;white-space:nowrap;cursor:pointer}
.btn:hover{background:#263b4b;color:#e8f1f5}
.btn.on{background:#203e40;color:#67dec2}
.btn.on::after{content:'';position:absolute;left:4px;right:4px;bottom:1px;height:1px;background:#67dec2}
.btn.dis{color:#5f6d78;cursor:default}
.arw{border-left:3px solid transparent;border-right:3px solid transparent;border-bottom:4px solid currentColor}
.icn{position:absolute;display:flex;align-items:center;justify-content:center;
  border:1px solid #334958;background:rgba(16,28,40,.88);box-shadow:1px 1px 0 rgba(0,0,0,.35);
  color:#90a8b8;cursor:pointer}
.icn:hover{background:#263b4b;color:#e8f1f5}
.icn.on{color:#67dec2;background:#203e40}
.mi{position:absolute;display:flex;align-items:center;gap:4px;font-size:9px;line-height:9px;
  color:#e8f1f5;cursor:pointer;white-space:nowrap;padding:0 3px}
.mi:hover{background:#263b4b}
.k{color:#67dec2;font-size:8px;margin-left:auto;padding-left:10px}
.v{color:#90a8b8;font-size:8px;margin-left:auto;padding-left:10px}
.txt{position:absolute;font-size:9px;line-height:9px;color:#90a8b8;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.acc{color:#67dec2}.gold{color:#ffd379}
.tab{position:absolute;display:flex;align-items:center;justify-content:center;font-size:9px;
  color:#90a8b8;cursor:pointer;border:1px solid #334958}
.tab:hover{background:#263b4b;color:#e8f1f5}
.tab.on{background:#203e40;color:#67dec2;border-color:#67dec2}
.fld{position:absolute;background:#0b0f16;border:1px solid #334958}
.fbtn{position:absolute;display:flex;align-items:center;justify-content:center;font-size:9px;
  color:#90a8b8;cursor:pointer;border:1px solid #334958;background:rgba(16,28,40,.9)}
.fbtn:hover{background:#263b4b;color:#e8f1f5}
.fbtn.pri{border-color:#67dec2;color:#67dec2}
.fbtn.dim{opacity:.4;pointer-events:none}
.cell{position:absolute;border:1px solid #26313d;cursor:pointer}
.cell:hover{border-color:#67dec2}
.cat{position:absolute;display:flex;align-items:center;font-size:8px;color:#90a8b8;cursor:pointer}
.cat:hover{color:#e8f1f5}
.cat.on{color:#67dec2}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.5)}
svg{display:block}

#ui{position:fixed;right:8px;bottom:8px;display:flex;gap:4px;opacity:.1;
  transition:opacity .18s;z-index:9}
#ui:hover{opacity:1}
#ui button{font:inherit;font-size:11px;padding:3px 7px;border:1px solid #2a3440;
  background:#0d1117;color:#90a8b8;border-radius:4px;cursor:pointer}
#ui button:hover{border-color:#67dec2;color:#67dec2}
#ui button[aria-pressed="true"]{border-color:#67dec2;color:#67dec2}
</style>
</head>
<body>
<div id="stage"><div id="cv"><div id="hud"></div></div></div>
<div id="ui">
  <button data-w="320" data-h="180">320</button>
  <button data-w="640" data-h="360">640</button>
  <button data-w="960" data-h="540" aria-pressed="true">960</button>
  <button data-w="1280" data-h="720">1280</button>
</div>

<script>
"use strict";
const px=v=>v+"px";
const M={TEXT:"#e8f1f5",MUTED:"#90a8b8",ACCENT:"#67dec2",GOLD:"#ffd379",DIS:"#5f6d78"};
const LH=9;
const tw=s=>{let w=0;for(const c of s)w+=/[\u2E80-\u9FFF\uFF00-\uFFEF]/.test(c)?9:6;return w;};
const B={C:32,P:12,A:13,G:4,H:20};
const S={W:960,H:540,scale:2,view:"root",tech:"dia",buildCat:"全部",buildCatOpen:false};

function LO(W,H){
  const m=Math.min(8,Math.min(W,H)/8|0),ins=Math.min(4,m),g=Math.min(4,m);
  const dh=Math.min(28,Math.max(0,H-2*m)),dy=H-m-dh;
  const bw=(l,a)=>Math.max(B.C,tw(l)+(a?B.A:0)+B.P);
  const pW=bw("投影",true),bW=bw("建造",false);
  const left={x:m,y:dy,w:pW+bW+g+2*ins,h:dh};
  const build={x:m+ins,y:dy+ins,w:bW,h:dh-2*ins};
  const proj={x:m+ins+bW+g,y:dy+ins,w:pW,h:dh-2*ins};
  const mW=bw("挖掘",false),sW=bw("清扫",false),cW=bw("殖民地",true);
  const ri=mW+g+sW+g+cW;
  const right={x:W-m-(ri+2*ins),y:dy,w:ri+2*ins,h:dh};
  let x=right.x+ins;
  const mine={x,y:dy+ins,w:mW,h:dh-2*ins};x+=mW+g;
  const sweep={x,y:dy+ins,w:sW,h:dh-2*ins};x+=sW+g;
  const col={x,y:dy+ins,w:cW,h:dh-2*ins};
  const gl=left.x+left.w,gr=right.x;
  const hw=Math.max(0,Math.min(480,gr-gl-16)),hh=Math.min(20,Math.max(0,H-2*m));
  const hint=hw>40?{x:gl+8,y:dy-Math.min(4,m)-hh,w:hw,h:hh}:null;
  const ic=Math.min(22,(W-2*m)/7|0);
  const ex={x:W-m-ic,y:m,w:ic,h:ic};
  const he={x:ex.x-g-ic,y:m,w:ic,h:ic};
  const lo={x:he.x-g-ic,y:m,w:ic,h:ic};
  const sum={x:m,y:m,w:Math.max(0,Math.min(156,he.x-m-g)),h:Math.min(20,Math.max(0,H-2*m))};
  return {W,H,m,g,dy,left,right,build,proj,mine,sweep,col,hint,lo,he,ex,sum,mMax:Math.max(0,dy-m-4),clear:gr-gl};
}

const PROJ=[{id:"save",l:"保存投影",k:"B"},{id:"library",l:"放置投影",k:"P"},
  {id:"limit",l:"相似上限",v:"64"}];
const COL=[{id:"people",l:"人物"},{id:"tasks",l:"任务",k:"O"},{id:"craft",l:"合成"},
  {id:"tech",l:"科研"},{id:"projects",l:"工程"}];
const IC={save:"save",library:"lib",build:"build",limit:"limit",people:"people",
  tasks:"task",craft:"craft",tech:"tech",projects:"proj"};

function mrect(L,which){
  const it=which==="projection"?PROJ:COL,an=which==="projection"?L.proj:L.col;
  const pad=3,hd=which==="colony"?32:0,ch=hd+it.length*B.H+(it.length-1);
  const mw=Math.max(an.w,which==="projection"?132:156);
  const mh=Math.min(L.mMax,ch+pad*2);
  return {x:which==="projection"?an.x:an.x+an.w-mw,y:Math.max(L.m,L.dy-4-mh),w:mw,h:mh,hd,pad,it};
}

const hud=document.getElementById("hud");
function el(t,c,s,p){const n=document.createElement(t);if(c)n.className=c;
  if(s)Object.assign(n.style,s);(p||hud).appendChild(n);return n;}
function P(r){el("div","p",{position:"absolute",left:px(r.x),top:px(r.y),width:px(r.w),height:px(r.h)});}
function C(x,y,w,h,bg,b){el("div",null,{position:"absolute",left:px(x),top:px(y),
  width:px(w),height:px(h),background:bg},b);}
function T(x,y,t,cls,extra){
  const n=el("div","txt"+(cls?" "+cls:""),Object.assign({left:px(x),top:px(y)},extra||{}));
  n.textContent=t;return n;}
/* 右边界裁剪：给定容器右缘，超出则按可用宽度截断并加省略号 */
function TR(x,y,right,t,cls,extra){
  const avail=right-x;
  const n=el("div","txt"+(cls?" "+cls:""),Object.assign({
    left:px(x),top:px(y),maxWidth:px(Math.max(0,avail)),
    overflow:"hidden",textOverflow:"ellipsis"},extra||{}));
  n.textContent=avail>=tw(t)?t:t.replace(/.$/,"")+"…";
  return n;}

function ico(k,lock){
  const s=[],L=(a,b,c,d)=>s.push(`<path d="M${a} ${b}L${c} ${d}"/>`),
    F=(x,y,w,h)=>s.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="currentColor" stroke="none"/>`);
  if(k==="lock"){F(2,7,11,7);const bx=lock?4:9;L(bx,7,bx,2);L(bx,2,bx+6,2);L(bx+6,2,bx+6,5);}
  else if(k==="help"){L(3,2,10,2);L(10,2,10,6);L(10,6,7,8);F(7,8,1,2);F(7,12,1,2);}
  else if(k==="exit"){L(1,7,13,7);L(1,7,6,2);L(1,7,6,12);}
  else if(k==="save"||k==="build"){F(2,1,10,12);F(4,2,5,3,1);F(4,8,6,4,1);}
  else if(k==="lib"){for(let r=0;r<3;r++){F(1,2+r*5,3,3);F(6,2+r*5,7,3);}}
  else if(k==="limit"){F(2,2,10,12);F(5,0,4,3);}
  else if(k==="people"){F(4,1,6,6);F(1,8,12,5);}
  else if(k==="task"){F(2,2,10,12);for(let r=0;r<3;r++)F(4,4+r*3,6,1,1);F(5,0,4,3);}
  else if(k==="craft"){F(2,3,10,9);L(4,6,10,6);L(7,3,7,12);}
  else if(k==="tech"){F(5,1,4,4);L(7,5,7,6);F(2,10,4,4);F(8,10,4,4);}
  else if(k==="proj"){F(1,3,5,9);F(8,3,5,9);L(6,7,8,7);}
  else if(k==="mine"){L(3,11,11,3);L(11,3,9,5);L(9,5,7,7);L(7,7,5,9);}
  else if(k==="sweep"){L(2,12,12,2);L(4,9,5,6);L(7,9,8,6);L(10,9,11,6);}
  return `<svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor"
    stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${s.join("")}</svg>`;
}

const D={workers:[{id:"a3f2-91",lv:3,xp:64,t:"钻石镐",j:"仓储扩建"},
    {id:"7b10-e4",lv:2,xp:31,t:"铁镐",j:"露天矿坑"},{id:"c58d-2a",lv:2,xp:18,t:"铁镐",j:"清扫"},
    {id:"1e44-9c",lv:1,xp:4,t:"石镐",j:""},{id:"9a07-33",lv:3,xp:96,t:"钻石镐",j:"居住区"},
    {id:"4d6b-77",lv:1,xp:0,t:"无",j:""}],
  jobs:[{k:"施工",n:"东侧仓储扩建",p:5,s:"进行中",c:1},{k:"挖掘",n:"露天矿坑",p:7,s:"缺料",c:2},
    {k:"清扫",n:"核心周边",p:3,s:"进行中",c:1},{k:"合成",n:"石镐 ×12",p:2,s:"等待材料",c:2}],
  proj:[{n:"东侧居住区",d:412,t:500},{n:"仓储网络",d:186,t:256}]};

/* 科技树：depth 0 为已完成的工具链，1 为待解锁分支 */
const TECH=[
  {id:"wood", n:"木器",   dep:null, c:[],                          t:0,   unl:"木镐 木斧 木铲 木棍", st:"done"},
  {id:"stone",n:"石器",   dep:"wood",c:["圆石 ×16"],              t:200, unl:"石镐 石斧 石铲",     st:"done"},
  {id:"iron", n:"铁器",   dep:"stone",c:["铁锭 ×8","煤炭 ×8"],    t:400, unl:"铁镐 铁斧 铁铲",     st:"done"},
  {id:"dia",  n:"钻石",   dep:"iron", c:["钻石 ×2","红石 ×16"],    t:600, unl:"钻石镐 钻石斧 钻石铲", st:"open"},
  {id:"water",n:"净水",   dep:"stone",c:["圆石 ×32","木桶 ×4"],    t:300, unl:"净水设施　 colonists 不再饮用脏水", st:"lock"},
  {id:"farm", n:"耕种",   dep:"wood", c:["木锄 ×1","种子 ×8"],     t:350, unl:"耕地 种植 收割",     st:"lock"},
  {id:"ranch",n:"畜牧",   dep:"farm", c:["木栅栏 ×16","饲料 ×8"],  t:400, unl:"畜栏 繁殖 产物",     st:"lock"},
  {id:"reactor",n:"红石反应堆",dep:"iron",c:["红石 ×64","铁锭 ×8","下界石英 ×16"],t:900,
   unl:"有限红石产能　有失控与爆炸风险", st:"lock"}
];
const TECHLBL={done:"已完成",open:"可研究",lock:"需前置",run:"研究中"};

const ST={
  root:{no:1},empty:{no:1,dis:1},
  "menu-projection":{no:1},"menu-colony":{no:1},
  save:{n:148,tool:"单选"},library:{n:148,tool:"单选"},build:{n:148,tool:"单选"},
  limit:{n:64,tool:"相似",hint:"左键点击一个方块，向外扩展同种方块"},
  people:{n:148,tool:"单选"},tasks:{n:148,tool:"单选"},craft:{n:148,tool:"单选"},
  tech:{n:148,tool:"单选"},projects:{n:148,tool:"单选"},
  order:{n:412,tool:"立体"},help:{no:1}
};

function dock(L,st){
  P(L.left);P(L.right);
  const mk=(r,l,a,ic,s,g)=>{
    const n=el("div","btn"+(s?" "+s:""),{left:px(r.x),top:px(r.y),width:px(r.w),height:px(r.h)});
    n.innerHTML=(ic?`<span style="display:flex;opacity:.9">${ic}</span>`:"")+`<span>${l}</span>`+
      (a?`<i class="arw"></i>`:"");
    if(g)n.addEventListener("click",e=>{e.stopPropagation();go(g);});
  };
  mk(L.build,"建造",false,ico("build"),S.view==="build"?"on":"","build-toggle");
  mk(L.proj,"投影",true,null,S.view==="menu-projection"?"on":"","menu-projection");
  mk(L.mine,"挖掘",false,ico("mine"),st.dis?"dis":"");
  mk(L.sweep,"清扫",false,ico("sweep"),st.dis?"dis":"");
  mk(L.col,"殖民地",true,null,S.view==="menu-colony"?"on":"","menu-colony");
}
function corner(L){
  [[L.lo,"lock",1],[L.he,"help",S.view==="help"],[L.ex,"exit",0]].forEach(([r,k,on])=>{
    const n=el("div","icn"+(on?" on":""),{left:px(r.x),top:px(r.y),width:px(r.w),height:px(r.h)});
    n.innerHTML=ico(k,1);
    if(k==="help")n.addEventListener("click",e=>{e.stopPropagation();go("help");});
  });
}
function sum(L,st){
  if(st.no)return;
  P(L.sum);
  const n=el("div","txt gold",{left:px(L.sum.x+7),top:px(L.sum.y+(L.sum.h-LH)/2)});
  n.innerHTML=`<i style="position:absolute;left:-6px;top:2px;bottom:2px;width:2px;background:${M.GOLD}"></i>${st.tool} · ${st.n}`;
}
function hint(L,st){
  if(!st.hint||!L.hint)return;
  P(L.hint);
  const n=el("div","txt",{left:px(L.hint.x+9),top:px(L.hint.y+(L.hint.h-LH)/2)});
  n.innerHTML=`<i style="position:absolute;left:-8px;top:3px;bottom:3px;width:2px;background:${M.ACCENT}"></i>${st.hint}`;
}
function menu(L,which){
  const m=mrect(L,which);
  if(m.w<40||m.h<20)return;
  P(m);
  let cy=m.y+m.pad;
  if(m.hd){
    const ri=m.x+m.w-m.pad;
    T(m.x+m.pad+1,cy,"殖民地",null,{color:M.TEXT});
    TR(m.x+m.pad+1,cy+11,ri,"工人 6 · 工程 2 · 任务 4");
    TR(m.x+m.pad+1,cy+21,ri,"科技：铁器　工作站 2","gold");
    C(m.x+m.pad,cy+m.hd-2,m.w-m.pad*2,1,"#334958");
    cy+=m.hd;
  }
  m.it.forEach(it=>{
    if(cy+B.H>m.y+m.h-m.pad)return;
    const n=el("div","mi",{left:px(m.x+m.pad),top:px(cy),width:px(m.w-m.pad*2),height:px(B.H)});
    n.innerHTML=`<span style="display:flex;opacity:.85">${ico(IC[it.id])}</span><span>${it.l}</span>`+
      (it.k?`<span class="k">${it.k}</span>`:"")+(it.v?`<span class="v">${it.v}</span>`:"");
    n.addEventListener("click",e=>{e.stopPropagation();go(it.id);});
    cy+=B.H+1;
  });
}

function dlg(L,w,h,draw){
  el("div","mask",{});
  const x=(L.W-w)/2,y=(L.H-h)/2;
  P({x,y,w,h});draw(x,y,w,h);
}
function head(x,y,w,t){T(x+12,y+9,t,null,{color:M.TEXT});T(x+w-17,y+9,"×");}

function vSave(L){dlg(L,Math.min(280,L.W-16),Math.min(116,L.H-16),(x,y,w,h)=>{
  head(x,y,w,"保存投影");
  C(x+12,y+23,w-24,1,"#334958");
  T(x+12,y+30,"将保存 148 个方块");
  el("div","fld",{left:px(x+12),top:px(y+44),width:px(w-24),height:"14px"});
  T(x+15,y+47,"输入名称…");
  TR(x+12,y+64,x+w-12,"colonycamera/presets　上限 8192 方块");
  const a=el("div","fbtn pri",{left:px(x+w-70),top:px(y+h-23),width:"54px",height:"15px"});a.textContent="保存";
  const b=el("div","fbtn",{left:px(x+12),top:px(y+h-23),width:"40px",height:"15px"});b.textContent="取消";
});}
function vLib(L){dlg(L,Math.min(306,L.W-16),Math.min(184,L.H-16),(x,y,w,h)=>{
  head(x,y,w,"预设库");
  const a=el("div","tab on",{left:px(x+12),top:px(y+23),width:"42px",height:"14px"});a.textContent="预设";
  const b=el("div","tab",{left:px(x+57),top:px(y+23),width:"42px",height:"14px"});b.textContent="投影";
  C(x+12,y+41,w-24,1,"#334958");
  [["石砖小屋",148,"24×16×12","12 橡木 6 玻璃"],["瞭望塔",312,"18×18×18","20 石 4 铁"],
   ["仓储前厅",96,"16×12×16","8 木 4 铁"],["农田模块",64,"16×16×16","16 泥土"]]
  .forEach(([n,v,dim,mat],i)=>{
    const ry=y+48+i*25;
    P({x:x+12,y:ry,w:w-24,h:21});C(x+12,ry,w-24,21,"rgba(30,48,64,.55)");
    T(x+18,ry+4,n,null,{color:M.TEXT});
    TR(x+18,ry+13,x+w-52,`${dim}　${v} 方块　${mat}`);
    T(x+w-46,ry+7,"放置",null,{color:M.ACCENT,cursor:"pointer"});
  });
});}
/* 建造目录：分类与文案取自 BuildPanel.CATEGORIES 与 zh_cn.json */
const BCAT=["全部","收藏","殖民地","自然","建材","机关","装饰"];
const BCELL=[
  ["石头",0],["木板",0],["玻璃",0],["铁块",0],["工作台",0],["熔炉",0],["箱子",0],["楼梯",0],
  ["台阶",0],["栅栏",0],["玻璃砖",0],["红石块",0],["煤矿",0],["铁矿",0],["金矿",0],["钻石矿",0],
  ["圆石",0],["黏土",0],["沙",0],["砾石",0],["橡木原木",0],["云杉原木",0],["白桦原木",0],["橡树叶",0],
  ["印刷铁块",0],["铁栅栏",0],["石砖",0],["石板",0],["陶瓦",0],["混凝土",0],["玻璃板",0],["书架",0],
  ["打印核心",1],["仓储箱",1],["连接块",1],["研究台",1],["合成台",1],["容量升级件",1],["堆叠升级件",1],["网络端口",1],
  ["石镐",1],["铁镐",1],["钻石镐",1],["石斧",1],["铁斧",1],["钻石斧",1],["木锄",2],["小麦种子",2],
  ["甜浆果",2],["苹果",2],["胡萝卜",2],["土豆",2],["橡木树苗",2],["骨头",2],["皮革",2],["羽毛",2]];
function vBuild(L){
  // 规格对齐 BuildPanelLayout：w=min(248, 可用宽*2/5)，h=min(420, 可用高-32)
  // 窄视口下压缩下限，保证不超出
  const availW=L.W-L.m*2, availH=L.H-L.m*2-32;
  const w=Math.max(120,Math.min(248,Math.floor(availW*2/5)));
  const h=Math.max(110,Math.min(420,availH));
  const x=L.m, y=L.m;
  P({x,y,w,h});
  const ins=Math.min(6,Math.min(w,h)/8), inside=w-2*ins;
  const right=x+w-ins;

  // 标题 + 关闭
  T(x+ins,y+6,"殖民地建造",null,{color:M.TEXT,fontSize:"10px"});
  const cl=el("div","tab",{left:px(right-15),top:px(y+5),width:"15px",height:"13px"});
  cl.textContent="×";
  cl.addEventListener("mousedown",e=>e.stopPropagation());
  cl.addEventListener("click",e=>{e.stopPropagation();go("root");});

  // 搜索框
  const sy=y+25;
  el("div","fld",{left:px(x+ins),top:px(sy),width:px(Math.max(20,inside-34)),height:"15px"});
  T(x+ins+4,sy+3,inside-34>60?"搜索名称、ID 或模组名…":"搜索…");
  const av=el("div","tab on",{left:px(x+ins+inside-66),top:px(sy),width:"32px",height:"15px"});
  av.textContent="可建";
  const rf=el("div","tab",{left:px(x+ins+inside-31),top:px(sy),width:"31px",height:"15px"});
  rf.textContent="刷新";

  // 分类：宽屏横排一整行；窄屏折叠为单个下拉（与原版及 BuildPanel.catsOpen 一致）
  const GAP=2, n=BCAT.length;
  const rowW=Math.floor((inside-GAP*(n-1))/n);
  const oneRow=rowW>=tw("殖民地")+4;
  const gy0=sy+20;
  if(oneRow){
    for(let i=0;i<n;i++){
      const t=el("div","tab"+(i===0?" on":""),
        {left:px(x+ins+i*(rowW+GAP)),top:px(gy0),width:px(rowW),height:"15px"});
      t.textContent=BCAT[i];
    }
  } else {
    const cur=S.buildCat||"全部";
    const t=el("div","tab on",{left:px(x+ins),top:px(gy0),width:px(inside-16),height:"15px"});
    t.textContent=cur;
    const ar=el("div","tab",{left:px(x+ins+inside-15),top:px(gy0),width:"15px",height:"15px"});
    ar.textContent="▾";
    const trigger=()=>{S.buildCatOpen=!S.buildCatOpen;render();};
    t.addEventListener("mousedown",e=>e.stopPropagation());
    t.addEventListener("click",e=>{e.stopPropagation();trigger();});
    ar.addEventListener("mousedown",e=>e.stopPropagation());
    ar.addEventListener("click",e=>{e.stopPropagation();trigger();});
  }
  // 分类下拉为浮层：覆盖在网格之上，不推移网格位置（与 BuildPanel.catsOpen 一致）
  let dropH=0;
  if(!oneRow&&S.buildCatOpen){
    const dw=inside-16, dh=n*15+(n-1)+4;
    const dx2=x+ins, dy2=gy0+16;
    P({x:dx2,y:dy2,w:dw,h:dh});
    for(let i=0;i<n;i++){
      const it=el("div","tab"+(BCAT[i]===(S.buildCat||"全部")?" on":""),
        {left:px(dx2+2),top:px(dy2+3+i*15),width:px(dw-4),height:"14px"});
      it.textContent=BCAT[i];
      it.addEventListener("mousedown",e=>e.stopPropagation());
      it.addEventListener("click",e=>{e.stopPropagation();
        S.buildCat=BCAT[i];S.buildCatOpen=false;render();});
    }
  }

  // 图标网格：26px 行高，列数自适应（对齐 cellHeight=26）
  const gy=gy0+18, cellH=26;
  const cols=Math.max(1,Math.floor(inside/20));
  const cellW=Math.floor(inside/cols);
  const rows=Math.max(0,Math.floor((y+h-8-gy)/cellH));
  const shown=Math.min(BCELL.length,cols*rows);
  for(let i=0;i<shown;i++){
    const r=Math.floor(i/cols), c=i%cols;
    const bx=x+ins+c*cellW, by=gy+r*cellH;
    const st=BCELL[i][1];
    const bg=st===0?"#2c4a3a":st===1?"#2a3a4a":"#3a2a2a";
    const bd=st===0?"#3f6b52":st===1?"#3f5a6b":"#6b3f3f";
    const cell=el("div",null,{position:"absolute",left:px(bx),top:px(by+2),
      width:px(Math.max(4,cellW-1)),height:px(cellH-4),background:bg,border:"1px solid "+bd,
      borderRadius:"2px",cursor:"pointer"});
    cell.addEventListener("mousedown",e=>e.stopPropagation());
    cell.addEventListener("click",e=>{e.stopPropagation();go("order");});
    C(bx+Math.floor((Math.max(4,cellW-1)-10)/2),by+4,10,10,st===0?"#5c8f47":st===1?"#5a7d9e":"#9e5a5a");
    const nm=BCELL[i][0];
    const lab=el("div","txt",{left:px(bx),top:px(by+16),width:px(cellW),
      textAlign:"center",color:"#8a97a3",fontSize:"7px",overflow:"hidden"});
    lab.textContent=tw(nm)>cellW-2?nm.replace(/.$/,"")+"…":nm;
  }
  // 收藏 + 计数
  const fv=el("div","tab",{left:px(right-22),top:px(y+h-21),width:"20px",height:"15px"});
  fv.textContent="★";
  T(x+ins,y+h-18,`${shown} / ${BCELL.length}`,"mut");
  TR(right-62,y+h-18,right-26,"查询中");
}

  const w=Math.min(328,L.W-16),h=Math.min(194,L.H-16);
  const x=(L.W-w)/2,y=(L.H-h)/2;
  P({x,y,w,h});
  head(x,y,w,"操作说明");
  C(x+12,y+23,w-24,1,"#334958");
  const rows=[["左键","单击单选 / 拖动面框选"],["右键","短按清空 / 拖动平移"],
    ["中键","短按循环工具 / 解锁后旋转"],["滚轮","缩放 8–96 格"],
    ["W A S D","按镜头朝向平移"],["空格 / C","镜头升降"],
    ["F7","锁定 / 解锁角度"],["G / V","追加 / 立体模式"],
    ["B / P / N","保存 / 预设库 / 建造目录"],["O","殖民地任务"],["F6 / Esc","返回第一人称"]];
  const rh=Math.max(9,Math.min(12,(h-40)/rows.length));
  let yy=y+28;
  rows.forEach(([k,v])=>{
    T(x+12,yy,k,"acc");T(x+12+Math.min(104,(w-24)/3),yy,v,null,{color:M.TEXT});yy+=rh;});
}
function vTechTree(L){
  // 窄视口改为上下排列：树在上、详情在下，避免横向挤压
  const narrow=L.W<520;
  const TW=narrow?Math.min(300,L.W-24):Math.min(268,L.W-24);
  const DW=narrow?0:Math.min(158,L.W-TW-32);
  const rowH=22, headH=24;
  const rows=TECH.length;
  const treeH=headH+rows*rowH+8;
  const detH=narrow?104:0;
  const w=narrow?TW:TW+DW+12;
  const h=Math.max(150,Math.min(L.H-24, narrow?treeH+detH+10:treeH+8));
  const x=(L.W-w)/2, y=(L.H-h)/2;
  P({x,y,w,h});
  head(x,y,w,"科技研究");
  C(x+10,y+22,w-20,1,"#334958");

  // ---- 技术树 ----
  const tx=x+10, ty=y+headH+4;
  TECH.forEach((t,i)=>{
    const ry=ty+i*rowH;
    const sel=t.id===S.tech;
    const dis=t.st==="lock";
    if(sel) C(tx-2,ry-2,TW+4,rowH-1,"#203e40");
    else if(i%2===0) C(tx-2,ry-2,TW+4,rowH-1,"rgba(30,48,64,.4)");
    const ind=t.dep&&TECH.find(z=>z.id===t.dep&&z.st!=="done")?8:0;
    el("div",null,{position:"absolute",left:px(tx+3+ind),top:px(ry+8),
      width:"5px",height:"5px",borderRadius:"50%",
      background:t.st==="done"?M.ACCENT:t.st==="open"?"#ffd379":t.st==="run"?M.ACCENT:"#3a4a56"});
    const nm=el("div","txt",{left:px(tx+13+ind),top:px(ry+6),color:sel?M.ACCENT:dis?M.DIS:M.TEXT});
    nm.textContent=t.n;
    // 前置依赖连线
    if(t.dep){
      const dep=TECH.findIndex(z=>z.id===t.dep);
      if(dep>=0&&dep<i&&TECH[dep].st!=="done"){
        C(tx+5,ry-rowH,1,rowH,"#2a3a44");
        C(tx+5,ry-rowH,rowH-2+ind,1,"#2a3a44");
      }
    }
    const n=el("div",null,{position:"absolute",left:px(tx-2),top:px(ry-2),
      width:px(TW+4),height:px(rowH-1),cursor:dis?"default":"pointer"});
    n.addEventListener("mousedown",e=>e.stopPropagation());
    n.addEventListener("click",e=>{e.stopPropagation();if(!dis){S.tech=t.id;render();}});
  });

  // ---- 详情：宽屏在右侧，窄屏在下方 ----
  const t=TECH.find(z=>z.id===S.tech)||TECH[0];
  const dx=narrow?x+10:x+TW+12, dw=narrow?w-20:DW;
  const dy=narrow?ty+rows*rowH+6:ty;
  C(dx,dy,dw,(narrow?detH-4:h-(ty-y)-6),"rgba(11,15,22,.55)");
  let cy2=dy+5;
  const D=(lab,val,cls)=>{
    TR(dx+7,cy2,dx+dw-7,lab,"mut");cy2+=11;
    const n2=TR(dx+7,cy2,dx+dw-7,val,cls);
    n2.style.whiteSpace="normal";n2.style.lineHeight="10px";cy2+=12;
  };
  const tName=el("div","txt",{left:px(dx+7),top:px(cy2),color:M.TEXT,fontSize:"10px"});
  tName.textContent=t.n;cy2+=14;
  const st=el("div","tab"+(t.st==="open"||t.st==="run"?" on":""),
    {left:px(dx+7),top:px(cy2),width:px(tw(TECHLBL[t.st])+12),height:"14px"});
  st.textContent=TECHLBL[t.st];
  if(t.st==="lock"){st.className="tab";st.style.color=M.DIS;}
  cy2+=20;
  D("前置",t.dep?(TECH.find(z=>z.id===t.dep)||{n:"?"}).n:"无");
  D("材料",t.c.length?t.c.join("　"):"无",t.c.length?"":M.DIS);
  D("耗时",t.t?t.t+" tick（"+Math.round(t.t/20)+" 秒）":"无",t.t?"":M.DIS);
  C(dx+7,cy2,dw-14,1,"#334958");cy2+=7;
  D("解锁",t.unl);
  if(t.id==="reactor"){TR(dx+7,cy2,dx+dw-7,"失控会炸毁方块","gold");cy2+=12;}
  const can=t.st==="open"||t.st==="run";
  const by=narrow?y+h-22:y+h-24;
  const b=el("div","fbtn"+(can?" pri":" dim"),{left:px(dx+7),top:px(by),
    width:"66px",height:"15px"});
  b.textContent=t.st==="run"?"研究中":t.st==="done"?"已完成":t.st==="lock"?"未解锁":"投入研究";
  if(can){
    b.addEventListener("mousedown",e=>e.stopPropagation());
    b.addEventListener("click",e=>{e.stopPropagation();t.st="run";render();});
  }
  if(t.st==="lock")TR(dx+81,by+3,dx+dw-7,"需先完成前置科技");
}

function vWork(L,tab){
  const W=Math.min(304,L.W-16);
  const N={tasks:"任务",craft:"合成",tech:"科研",people:"人物",projects:"工程"};
  const PADD=48;
  const need={tasks:24+15+27*4+14,craft:24+15+21*6,tech:24+9+13+13+9+9+13+20+16,
    people:24+15+20*6,projects:24+15+28*2+26}[tab]+PADD;
  const h=Math.max(132,Math.min(need,L.H-16));
  const x=(L.W-W)/2,y=(L.H-h)/2;
  P({x,y,w:W,h});
  const w=W;
  head(x,y,w,N[tab]);
  // 五个页签统一渲染，全部可点；页签宽度按最长标签计算，避免文字被裁
  const tw2=s=>{let a=0;for(const c of s)a+=/[\u2E80-\u9FFF\uFF00-\uFFEF]/.test(c)?9:6;return a;};
  const ORDER=["tasks","craft","tech","people","projects"];
  const GAP=3;
  let tx=x+10;
  for(const t of ORDER){
    const label=N[t], bw2=tw2(label)+12;
    if(tx+bw2>x+w-10) break;
    const n=el("div","tab"+(t===tab?" on":""),
      {left:px(tx),top:px(y+23),width:px(bw2),height:"15px"});
    n.textContent=label;
    if(t!==tab)n.addEventListener("click",e=>{e.stopPropagation();go(t);});
    tx+=bw2+GAP;
  }
  C(x+10,y+42,w-20,1,"#334958");
  let cy=y+49;
  if(tab==="tasks"){
    TR(x+12,cy,x+w-12,"优先度 1–9　数字大者先，同级按创建顺序");cy+=15;
    D.jobs.forEach(j=>{
      P({x:x+10,y:cy-3,w:w-20,h:24});C(x+10,cy-3,w-20,24,"rgba(30,48,64,.55)");
      TR(x+16,cy+2,x+w-68,`P${j.p}　${j.n}`,null,{color:M.TEXT});
      TR(x+16,cy+13,x+w-68,`${j.k}　#${118+j.p}`);
      TR(x+w-64,cy+7,x+w-14,j.s,j.c===1?"acc":"gold");
      cy+=27;});
    TR(x+12,cy+2,x+w-12,"暂停／取消保留已挖方块与真实持料");
  } else if(tab==="craft"){
    TR(x+12,cy,x+w-12,"工作站 2　需三格内自有仓储");cy+=15;    [["木棍",64,"1 原木 → 4",1],["石镐",12,"3 圆石 + 2 木棍",1],["铁镐",8,"需科技：铁器",0],
     ["网络连接块",32,"需科技：铁器",0],["仓储箱",8,"6 铁锭 + 3 木板",1],["容量升级件",4,"4 铁锭",1]]
    .forEach(([n,c,mat,ok])=>{
      P({x:x+10,y:cy-3,w:w-20,h:19});C(x+10,cy-3,w-20,19,"rgba(30,48,64,.55)");
      TR(x+16,cy+1,x+82,n,null,{color:ok?M.TEXT:M.DIS});
      TR(x+84,cy+1,x+w-56,mat);
      const q=el("div","fbtn"+(ok?"":" dim"),{left:px(x+w-52),top:px(cy-1),width:"34px",height:"13px"});
      q.textContent="生产";cy+=21;});
  } else if(tab==="tech"){
    T(x+12,cy,"当前阶段");
    T(x+12,cy+11,"铁器",null,{color:M.GOLD,fontSize:"10px"});
    TR(x+12,cy+26,x+w-12,"已解锁　铁镐 / 铁斧 / 铁铲");
    C(x+12,cy+38,w-24,1,"#334958");
    const open=TECH.filter(t=>t.st==="open"||t.st==="lock").length;
    TR(x+12,cy+45,x+w-12,`可研究 ${open} 项　已解锁 ${TECH.filter(t=>t.st==="done").length} 项`,null,{color:M.TEXT});
    TR(x+12,cy+58,x+w-12,"研究须消耗真实材料，完成后原子扣料");
    const b=el("div","fbtn pri",{left:px(x+12),top:px(cy+76),width:"76px",height:"16px"});
    b.textContent="开始研究";
    b.addEventListener("mousedown",e=>e.stopPropagation());
    b.addEventListener("click",e=>{e.stopPropagation();go("techtree");});
  } else if(tab==="people"){
    T(x+12,cy,"已加载工人");cy+=15;
    D.workers.forEach(k=>{
      P({x:x+10,y:cy-3,w:w-20,h:18});C(x+10,cy-3,w-20,18,"rgba(30,48,64,.55)");
      const ri=x+w-16;
      TR(x+16,cy+1,x+92,k.id,null,{color:M.TEXT});
      TR(x+92,cy+1,x+168,`Lv ${k.lv}　${k.xp} xp`);
      TR(x+172,cy+1,x+230,k.t);
      TR(x+234,cy+1,ri,k.j);
      cy+=20;});
  } else {
    T(x+12,cy,"进行中 2　每维度上限 32 个工程");cy+=15;
    D.proj.forEach(p=>{
      P({x:x+10,y:cy-3,w:w-20,h:26});C(x+10,cy-3,w-20,26,"rgba(30,48,64,.55)");
      TR(x+16,cy+3,x+w-100,p.n,null,{color:M.TEXT});
      TR(x+16,cy+14,x+w-100,`优先度 5　${p.d} / ${p.t} 方块`);
      C(x+w-92,cy+7,56,5,"#1b2b33");
      C(x+w-92,cy+7,Math.max(0,Math.min(56,Math.round(56*p.d/p.t))),5,M.ACCENT);
      cy+=26;});
    const b=el("div","fbtn pri",{left:px(x+12),top:px(cy+6),width:"64px",height:"15px"});
    b.textContent="打印工人";
  }
}

function render(){
  const L=LO(S.W,S.H);
  const cv=document.getElementById("cv");
  cv.style.width=px(S.W);cv.style.height=px(S.H);
  cv.style.transform=`scale(${S.scale})`;
  cv.style.margin=`${-(S.H*S.scale-S.H)/2}px ${-(S.W*S.scale-S.W)/2}px`;
  hud.innerHTML="";
  const st=ST[S.view]||ST.root;
  if(S.view==="menu-projection")menu(L,"projection");
  if(S.view==="menu-colony")menu(L,"colony");
  dock(L,st);sum(L,st);hint(L,st);corner(L);
  if(S.view==="save")vSave(L);
  else if(S.view==="library")vLib(L);
  else if(S.view==="build")vBuild(L);
  else if(S.view==="limit")vLimit(L);
  else if(S.view==="order")vOrder(L);
  else if(S.view==="help")vHelp(L);
  else if(S.view==="techtree")vTechTree(L);
  else if(["tasks","craft","tech","people","projects"].includes(S.view))vWork(L,S.view);
}
function go(v){
  if(v==="build-toggle")v=S.view==="build"?"root":"build";
  S.view=v;render();
}

// 建造目录为常驻面板：点空白不关闭，只能点 × 或再次点击「建造」按钮关闭
hud.addEventListener("click",()=>{
  if(S.view==="build")return;
  if(S.view!=="root")go("root");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){go("root");return;}
  const m={1:"root",2:"menu-projection",3:"menu-colony",4:"save",5:"library",6:"build-toggle",
    7:"people",8:"tasks",9:"craft",0:"tech",q:"limit",w:"projects",e:"order",r:"help",t:"empty",
    y:"techtree"};
  const k=m[e.key.toLowerCase()];
  if(k)go(k);
});
document.querySelectorAll("#ui button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#ui button").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true");S.W=+b.dataset.w;S.H=+b.dataset.h;fit();render();}));
function fit(){
  const s=Math.min((window.innerWidth-40)/S.W,(window.innerHeight-40)/S.H,3);
  S.scale=Math.max(.5,Math.floor(s*4)/4);
}
window.addEventListener("resize",()=>{fit();render();});
fit();render();
</script>
